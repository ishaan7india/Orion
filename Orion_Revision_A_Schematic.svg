<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<rect width="1600" height="1100" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#18212b}.title{font-size:32px;font-weight:bold}.sub{font-size:18px;fill:#465568}.head{font-size:20px;font-weight:bold}.body{font-size:16px}.small{font-size:14px}.box{fill:#f4f7fb;stroke:#34495e;stroke-width:2}.net{stroke:#31708e;stroke-width:3;fill:none}.warn{fill:#fff3cd;stroke:#b08900;stroke-width:2}</style>
<text x="55" y="60" class="title">ORION • Revision A schematic overview</text><text x="55" y="92" class="sub">Source: uploaded Pasted text.txt • functional capture map • not a routed PCB or ERC/DRC result</text>
<rect x="55" y="130" width="380" height="275" rx="12" class="box"/><text x="78" y="168" class="head">Raspberry Pi Pico</text><text x="78" y="202" class="body">3V3(OUT) → +3V3  •  GND → GND</text><text x="78" y="232" class="body">GP4 SDA / GP5 SCL</text><text x="78" y="262" class="body">GP6–GP13 → ROW0–ROW7</text><text x="78" y="292" class="body">GP14/15 → ENC_A / ENC_B</text><text x="78" y="322" class="body">GP16 → RGB_DATA_3V3</text><text x="78" y="352" class="body">GP22 JOY_SW • GP26/27 JOY_X/Y</text>
<rect x="535" y="130" width="460" height="275" rx="12" class="box"/><text x="558" y="168" class="head">I²C + column expanders</text><text x="558" y="202" class="body">U1 MCP23017 @ 0x20 • GPA0–7 → COL0–7</text><text x="558" y="232" class="body">U2 MCP23017 @ 0x21 • GPA0–7 → COL8–15</text><text x="558" y="262" class="body">Both SDA/SCL share GP4/GP5</text><text x="558" y="292" class="body">R1/R2 4.7k pullups to +3V3 (DNP if OLED pulls up)</text><text x="558" y="322" class="body">OLED 4-pin: +3V3, GND, SDA, SCL</text><text x="558" y="352" class="body">Reset 10k pullups • 100nF per expander</text>
<rect x="1095" y="130" width="450" height="275" rx="12" class="box"/><text x="1118" y="168" class="head">8 × 16 key matrix</text><text x="1118" y="202" class="body">127 switches + 127 × 1N4148W SOD-123</text><text x="1118" y="232" class="body">COL → diode anode → stripe/cathode → switch → ROW</text><text x="1118" y="262" class="body">ROW4/COL13 intentionally empty</text><text x="1118" y="292" class="body">Encoder push uses ROW7/COL15 key position</text><text x="1118" y="322" class="body">Connector concept: 8 ROW + 16 COL + 2 GND</text><text x="1118" y="352" class="body">Final switch placement/footprints still to verify</text>
<path d="M435 265H535M995 265H1095" class="net"/><text x="460" y="250" class="small">I2C + ROW</text><text x="1015" y="250" class="small">COL0–15</text>
<rect x="55" y="465" width="460" height="245" rx="12" class="box"/><text x="78" y="503" class="head">Joystick + encoder</text><text x="78" y="537" class="body">RKJXV1224005 axes: +3V3 / GND / JOY_X / JOY_Y</text><text x="78" y="567" class="body">JOY_X → GP26/ADC0 • JOY_Y → GP27/ADC1</text><text x="78" y="597" class="body">Joystick switch → GP22 with switch return to GND</text><text x="78" y="627" class="body">PEC11R: C→GND • A/B→GP14/GP15</text><text x="78" y="657" class="body">Encoder push: standard ROW7/COL15 matrix key</text>
<rect x="570" y="465" width="475" height="245" rx="12" class="box"/><text x="593" y="503" class="head">Protected RGB rail + level shift</text><text x="593" y="537" class="body">J_RGB: external regulated 5V → RGB_5V_IN</text><text x="593" y="567" class="body">F1 1812L300/33DR → RGB_5V • C5 1000µF</text><text x="593" y="597" class="body">U4 74AHCT125: GP16 → 1A; 1Y → 330Ω</text><text x="593" y="627" class="body">330Ω → LED1 DIN • common GND</text><text x="593" y="657" class="body">Never join RGB 5V to Pico VBUS/VSYS/3V3</text>
<rect x="1100" y="465" width="445" height="245" rx="12" class="box"/><text x="1123" y="503" class="head">WS2812B-2020 chain</text><text x="1123" y="537" class="body">128 LEDs • VDD=RGB_5V • GND=GND</text><text x="1123" y="567" class="body">LEDn DOUT → LEDn+1 DIN; LED128 to test pad</text><text x="1123" y="597" class="body">100nF bypass at each LED (128 total)</text><text x="1123" y="627" class="body">3A supply depends on firmware cap 48/255</text><text x="1123" y="657" class="body">Power injection/copper capacity not laid out</text>
<rect x="55" y="760" width="1490" height="245" rx="12" class="warn"/><text x="82" y="802" class="head">Open items / review before fabrication</text><text x="82" y="842" class="body">• Corrected specification says 127-key 8×16 matrix; existing project draft says 114-key 10×12. Reconcile key map, firmware, and physical placement.</text><text x="82" y="876" class="body">• Verify Pico module/socket, OLED header order, switch/encoder/LED footprints and orientation, connector part numbers, board boundaries, and mounting.</text><text x="82" y="910" class="body">• Validate RGB supply/current against brightness cap and actual system behavior; 3A does not support unrestricted full-white load.</text><text x="82" y="944" class="body">Pin-level KiCad XML netlist and pin/net index are included; Eeschema symbol capture and PCB routing/checks remain to be completed.</text>
<text x="55" y="1055" class="small">See Orion_Revision_A.net, Orion_Revision_A_Pin_Net_Index.csv, handoff notes, and BOM for component/net details.</text></svg>
